<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="panel.css"><title>Afterecho</title></head><body>
<div class="app"><aside class="sidebar"><div class="brand"><span class="brand-icon">♫</span><div><strong>Afterecho</strong><small>AFTERECHO</small></div></div><div class="section-title">我的歌单<button id="new-list" title="新建歌单">＋</button></div><form id="create" hidden><input name="name" aria-label="新歌单名称" placeholder="输入歌单名称" required><div><button class="primary">创建</button><button type="button" id="cancel-create">取消</button></div></form><div id="playlists"></div><div id="playlist-tools"></div><div class="section-title">浏览</div><nav id="views"></nav><div class="section-title">解析检查</div><nav id="checks"></nav><p class="sidebar-note">仅启用的歌单挂载到 ECHO。<br>其他歌单可以独立整理。</p></aside>
<section class="workspace"><header><div><small>Afterecho 0.2.0</small><h1 id="list-title">虚拟音乐库</h1><span id="mount-state"></span></div><div id="actions"></div></header><div class="ingest"><button id="connect-echo">连接 ECHO</button><button id="add-online" class="primary">＋ 搜索添加</button><label class="file-button">导入歌单<input id="import-file" type="file" accept=".txt,.json" hidden></label><button id="tips" class="quiet" title="查看导入格式">ⓘ 说明</button></div><section class="prepare"><div><strong>歌曲预解析</strong><span id="prepare-status">预先匹配音源</span></div><button id="prepare-start">开始</button><button id="prepare-stop">停止</button></section><div id="status" role="status"></div><div class="browse-bar"><h2 id="view-title">全部歌曲</h2><input id="query" aria-label="搜索全部歌曲" placeholder="搜索全部歌曲中的歌名、歌手、专辑"><button id="layout" title="切换专辑列表 / 方块">▦ 方块</button><button id="edit-mode">编辑</button></div><main id="content"></main><footer id="pagination"></footer><div id="bulk-bar" hidden><strong id="selection-count">已选 0 首</strong><button id="select-all">全选结果</button><button id="invert">反选结果</button><button id="copy">复制到…</button><button id="move">移入…</button><button id="delete-selected" class="danger">删除</button><button id="done-edit">完成</button></div></section>
<aside class="inspector"><div class="section-title">歌曲详情</div><div id="inspector"><div class="empty">选择歌曲<br><small>核对原始信息、编辑元数据<br>或重新选择解析来源</small></div></div></aside></div>
<dialog id="modal"><div class="dialog-head"><h2 id="modal-title"></h2><button id="close-modal" aria-label="关闭">×</button></div><div id="modal-body"></div></dialog><script src="__bridge__.js"></script><script src="panel.js"></script></body></html>
